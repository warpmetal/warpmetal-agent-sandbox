name: Test and publish image

on:
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - "Containerfile"
      - "agent-tools.json"
      - "package-lock.json"
      - "package.json"
      - "scripts/**"
      - "test-browser.cjs"
      - "test-image.sh"
      - "test-tools.cjs"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - ".dockerignore"
      - "Containerfile"
      - "agent-tools.json"
      - "package-lock.json"
      - "package.json"
      - "scripts/**"
      - "test-browser.cjs"
      - "test-image.sh"
      - "test-tools.cjs"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/warpmetal/warpmetal-agent-sandbox

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/validate-agent-tools.mjs

  test:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
          - architecture: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Build local image
        run: docker build --pull --platform "${{ matrix.platform }}" --tag "warpmetal-agent-sandbox:test-${{ matrix.architecture }}" --file Containerfile .
      - name: Verify fixed tools, browser rendering, and non-root boundary
        run: sh test-image.sh "warpmetal-agent-sandbox:test-${{ matrix.architecture }}"

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish immutable multi-architecture image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign published image digest with GitHub OIDC
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Record immutable digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "Published \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
